name: Build PDFs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-science

      - name: Build PDFs
        shell: pwsh
        run: ./build.ps1 all

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: td-pdfs
          path: pdf/*.pdf
